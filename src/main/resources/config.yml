# HardcoreCompass defaults for Paper/Purpur 1.21.1, Java 21
config-version: 3
lives:
  starting: 2
  debug-info: true
world: world
teleport:
  min-radius: 10000
  max-radius: 30000
  attempts: 80
  border-margin: 16
  avoid-water: true
  avoid-lava: true
  avoid-void: true
  search-radius: 8
penalties:
  wipe-inventory: true
  clear-ender-chest: true
  clear-xp: true
  clear-bed-spawn: true
  enable-rtp: true
starter:
  enabled: true
  lodestone: true
  compass: true
