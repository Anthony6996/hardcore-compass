# HardcoreCompass messages and settings. Existing installations migrate automatically.
config-version: 5
lives: {starting: 2, debug-info: true}
world: world
teleport:
  min-radius: 10000
  max-radius: 30000
  attempts: 80
  border-margin: 16
  avoid-water: true
  avoid-lava: true
  avoid-void: true
  search-radius: 8
  spawn-min-distance: 750
  spawn-history-limit: 10
penalties: {wipe-inventory: true, clear-ender-chest: true, clear-xp: true, clear-bed-spawn: true, enable-rtp: true}
starter: {enabled: true, lodestone: true, compass: true}
compass: {preserve-on-first-death: true, reset-death-count-on-new-compass: false}
lodestone: {break-protection: none, untrack-compasses-on-break: true, require-custom-block: true}
recipe:
  compass: {enabled: true, shape: [" R ", "RCR", " R "], ingredients: {R: REDSTONE, C: COMPASS}}
  lodestone: {enabled: true, shape: ["III", "ILI", "III"], ingredients: {I: IRON_INGOT, L: LODESTONE}}
messages:
  language: en
  en:
    compass-name: '&6Hardcore Compass'
    compass-bound-lore: '&7Bound to Hardcore Lodestone at {x}, {y}, {z}. Right-click another Hardcore Lodestone to rebind.'
    compass-unbound: '&7Unbound. Right-click a Hardcore Lodestone to begin tracking.'
    compass-lost: '&cTarget lodestone is missing. Right-click a Hardcore Lodestone to rebind.'
    compass-target-label: '&6Target: {label}'
    hardcore-lodestone-only: '&cYou can only bind a Hardcore Compass to a Hardcore Lodestone.'
    lodestone-name: '&6Hardcore Lodestone'
    lodestone-lore: '&7Use this lodestone with a Hardcore Compass to track its location.'
    compass-bound: '&aYour Hardcore Compass is now tracking this lodestone.'
    compass-rebound: '&aYour Hardcore Compass now tracks the new lodestone at {x}, {y}, {z}.'
    compass-target-broken: '&6[Hardcore] &cYour bound lodestone has been destroyed!'
    compass-unbound-message: '&7Right-click a Hardcore Lodestone to bind.'
    lodestone-break-denied: '&cYou cannot break this Hardcore Lodestone.'
    no-permission: '&cNo permission.'
  es:
    compass-name: '&6Brújula Hardcore'
    compass-bound-lore: '&7Vinculada a la Piedra imán Hardcore en {x}, {y}, {z}. Haz clic derecho en otra para cambiar el objetivo.'
    compass-unbound: '&7Sin vincular. Haz clic derecho en una Piedra imán Hardcore para comenzar a rastrear.'
    compass-lost: '&cFalta la Piedra imán objetivo. Haz clic derecho en una Piedra imán Hardcore para volver a vincularla.'
    compass-target-label: '&6Objetivo: {label}'
    hardcore-lodestone-only: '&cSolo puedes vincular una brújula Hardcore a una Piedra imán Hardcore.'
    lodestone-name: '&6Piedra imán Hardcore'
    lodestone-lore: '&7Usa esta piedra imán con una Brújula Hardcore para rastrear su ubicación.'
    compass-bound: '&aTu brújula Hardcore ahora apunta a esta Piedra imán.'
    compass-rebound: '&aTu brújula Hardcore ahora apunta a la nueva Piedra imán en {x}, {y}, {z}.'
    compass-target-broken: '&6[Hardcore] &c¡Tu piedra imán vinculada ha sido destruida!'
    compass-unbound-message: '&7Haz clic derecho en una Piedra imán Hardcore para vincularla.'
    lodestone-break-denied: '&cNo puedes romper esta Piedra imán Hardcore.'
    no-permission: '&cNo tienes permiso.'
  compass-name: '&6Hardcore Compass'
  compass-bound-lore: '&7Bound to {x}, {y}, {z}'
  lodestone-name: '&6Hardcore Lodestone'
  lodestone-lore: '&7A lodestone for Hardcore Compass navigation.'
  no-permission: '&cNo permission.'
