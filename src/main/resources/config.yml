# Config schema is migrated automatically by ConfigManager.
config-version: 5
lives: {starting: 2, debug-info: true}
world: world
teleport:
  min-radius: 10000
  max-radius: 30000
  attempts: 80
  border-margin: 16
  avoid-water: true
  avoid-lava: true
  avoid-void: true
  search-radius: 8
  spawn-min-distance: 750
  spawn-history-limit: 10
penalties: {wipe-inventory: true, clear-ender-chest: true, clear-xp: true, clear-bed-spawn: true, enable-rtp: true}
starter: {enabled: true, lodestone: true, compass: true}
compass: {preserve-on-first-death: true, reset-death-count-on-new-compass: false}
lodestone: {break-protection: none, untrack-compasses-on-break: true}
recipe:
  compass:
    enabled: true
    shape: [" R ", "RCR", " R "]
    ingredients: {R: REDSTONE, C: COMPASS}
  lodestone:
    enabled: true
    shape: ["III", "ILI", "III"]
    ingredients: {I: IRON_INGOT, L: LODESTONE}
messages:
  language: en
  no-permission: '&cNo permission.'
  preserve-usage: '&eUsage: /hcompass setpreserve <true|false>'
  preserve-set: '&aFirst-death compass preservation set to {value}.'
  reset-usage: '&eUsage: /hcompass reset <player> deaths'
  reset-deaths: '&aDeath count reset for {player}.'
  wipelinks-usage: '&eUsage: /hcompass wipelinks <player>'
  wipelinks-done: '&aCompass links cleared for {player}.'
  lodestone-break-denied: '&cYou cannot break this Hardcore Lodestone.'
  compass-name: '&6Hardcore Compass'
  compass-bound-lore: '&7Bound to {x}, {y}, {z}'
  compass-unbound: '&7Right-click a Hardcore Lodestone to bind.'
  compass-lost: '&cTarget lodestone is missing. Rebind at a Hardcore Lodestone.'
  lodestone-name: '&6Hardcore Lodestone'
  lodestone-lore: '&7A lodestone for Hardcore Compass navigation.'
  compass-name-lodestone: '&6Hardcore Lodestone'
  en: {no-permission: '&cNo permission.'}
  es: {no-permission: '&cNo tienes permiso.'}
