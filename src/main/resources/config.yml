# HardcoreCompass messages and settings. Existing installations migrate automatically.
config-version: 5
lives: {starting: 2, debug-info: true}
world: world
teleport:
  min-radius: 10000
  max-radius: 30000
  attempts: 80
  border-margin: 16
  avoid-water: true
  avoid-lava: true
  avoid-void: true
  search-radius: 8
  spawn-min-distance: 750
  spawn-history-limit: 10
penalties: {wipe-inventory: true, clear-ender-chest: true, clear-xp: true, clear-bed-spawn: true, enable-rtp: true}
starter: {enabled: true, lodestone: true, compass: true}
compass: {preserve-on-first-death: true, reset-death-count-on-new-compass: false}
lodestone: {break-protection: none, untrack-compasses-on-break: true, require-custom-block: false}
recipe:
  compass: {enabled: true, shape: [" R ", "RCR", " R "], ingredients: {R: REDSTONE, C: COMPASS}}
  lodestone: {enabled: true, shape: ["III", "ILI", "III"], ingredients: {I: IRON_INGOT, L: LODESTONE}}
messages:
  language: en
  en:
    compass-bound: '&aYour Hardcore Compass is now tracking this lodestone.'
    compass-rebound: '&aYour Hardcore Compass now tracks the new lodestone at {x}, {y}, {z}.'
    compass-target-broken: '&6[HardcoreCompass] &cYour compass target at {x}, {y}, {z} was broken. Rebind it at a Hardcore Lodestone.'
    compass-lost: '&cTarget lodestone is missing. Rebind at a Hardcore Lodestone.'
    compass-unbound: '&7Right-click a Hardcore Lodestone to bind.'
    no-permission: '&cNo permission.'
  es:
    compass-bound: '&aTu brújula Hardcore ahora apunta a esta Piedra imán.'
    compass-rebound: '&aTu brújula Hardcore ahora apunta a la nueva Piedra imán en {x}, {y}, {z}.'
    compass-target-broken: '&6[HardcoreCompass] &cEl objetivo de tu brújula en {x}, {y}, {z} fue destruido. Vuelve a vincularla en una Piedra imán Hardcore.'
    compass-lost: '&cFalta la Piedra imán objetivo. Vuelve a vincular la brújula en una Piedra imán Hardcore.'
    compass-unbound: '&7Haz clic derecho en una Piedra imán Hardcore para vincularla.'
    no-permission: '&cNo tienes permiso.'
  compass-name: '&6Hardcore Compass'
  compass-bound-lore: '&7Bound to {x}, {y}, {z}'
  lodestone-name: '&6Hardcore Lodestone'
  lodestone-lore: '&7A lodestone for Hardcore Compass navigation'
  no-permission: '&cNo permission.'
