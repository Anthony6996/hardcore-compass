# HardcoreCompass defaults for Paper/Purpur 1.21.1, Java 21
config-version: 2
lives:
  starting: 2
  debug-info: true
world: world
teleport:
  min-radius: 10000
  max-radius: 30000
  attempts: 80
  border-margin: 16
  avoid-water: true
  avoid-lava: true
  avoid-void: true
  search-radius: 8
penalties:
  wipe-inventory: true
  clear-ender-chest: true
  clear-xp: true
  clear-bed-spawn: true
  enable-rtp: true
starter:
  enabled: true
  lodestone: true
  compass: true
messages:
  language: en
  first-join: '&aWelcome! You have {lives} lives. Your compass is ready.'
  death-one: '&eThat was close! {lives} life left. Your tagged compass survives this first death.'
  death-final: '&cNo lives remain. Your inventory was cleared and you have been relocated.'
  no-world: '&cConfigured world not found; safe relocation was skipped.'
  lives-self: '&eLives remaining: {lives}'
  lives-other: '&e{player} has {lives} lives.'
  set-lives: '&aSet {player} to {lives} lives.'
  reset: '&aReset {player} to starting lives and cleared death/compass history.'
  info: '&e{player}: lives={lives}, deaths={deaths}, compass previously preserved={compass}'
  reloaded: '&aHardcoreCompass configuration reloaded.'
  usage: '&eUse /hcompass help for commands.'
  help: |-
    &6=== HardcoreCompass ===
    &e/hcompass info &7- View compass status
    &e/hcompass lang <es|en> &7- Toggle language
    &e/hcompass give <player> [type] &7- Give starter gear (admin)
    &e/hcompass reset <player> &7- Reset player lives (admin)
    &e/hcompass help &7- Show this help menu
  compass-lore: '&7Right-click a lodestone to start tracking'
  give-usage: '&eUsage: /hcompass give <player> [compass|lodestone|all]'
  give-success: '&aGave {item} to {player}.'
  player-not-found: '&cThat player is not online.'
  lang-usage: '&eUsage: /hcompass lang <es|en>'
  lang-set: '&aLanguage changed and saved.'
  lang-current-default: '&eYour language follows the server default.'
  en:
    first-join: '&aWelcome! You have {lives} lives. Your compass is ready.'
    death-one: '&eThat was close! {lives} life left. Your tagged compass survives this first death.'
    death-final: '&cNo lives remain. Your inventory was cleared and you have been relocated.'
    help: |-
      &6=== HardcoreCompass ===
      &e/hcompass info &7- View compass status
      &e/hcompass lang <es|en> &7- Toggle language
      &e/hcompass give <player> [type] &7- Give starter gear (admin)
      &e/hcompass reset <player> &7- Reset player lives (admin)
      &e/hcompass help &7- Show this help menu
    compass-lore: '&7Right-click a lodestone to start tracking'
    give-usage: '&eUsage: /hcompass give <player> [compass|lodestone|all]'
    give-success: '&aGave {item} to {player}.'
    player-not-found: '&cThat player is not online.'
    lang-usage: '&eUsage: /hcompass lang <es|en>'
    lang-set: '&aLanguage changed and saved.'
    lang-current: '&eYour language is {language}.'
  es:
    first-join: '&a¡Bienvenido! Tienes {lives} vidas. Tu brújula está lista.'
    death-one: '&e¡Por poco! Te queda {lives} vida. Tu brújula sobrevive a esta primera muerte.'
    death-final: '&cNo te quedan vidas. Tu inventario se limpió y te hemos trasladado.'
    help: |-
      &6=== HardcoreCompass ===
      &e/hcompass info &7- Ver el estado de la brújula
      &e/hcompass lang <es|en> &7- Cambiar idioma
      &e/hcompass give <jugador> [tipo] &7- Dar equipo inicial (admin)
      &e/hcompass reset <jugador> &7- Reiniciar las vidas (admin)
      &e/hcompass help &7- Mostrar esta ayuda
    compass-lore: '&7Haz clic derecho en una magnetita para empezar a rastrear'
    give-usage: '&eUso: /hcompass give <jugador> [compass|lodestone|all]'
    give-success: '&aSe entregó {item} a {player}.'
    player-not-found: '&cEse jugador no está conectado.'
    lang-usage: '&eUso: /hcompass lang <es|en>'
    lang-set: '&aIdioma cambiado y guardado.'
    lang-current: '&eTu idioma es {language}.'
