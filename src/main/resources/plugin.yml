name: HardcoreCompass
version: '${project.version}'
main: com.anthony6996.hardcorecompass.HardcoreCompassPlugin
api-version: '1.21'
author: Anthony6996
description: UUID lives, lodestone compasses, and safe random respawns.
commands:
  hcompass:
    aliases: [hc]
    description: HardcoreCompass administration and player information
    usage: /hc help
permissions:
  hardcorecompass.admin:
    description: Manage HardcoreCompass lives, items, language, and configuration
    default: op
  hardcorecompass.lives:
    description: View your own remaining lives
    default: true
  hardcorecompass.craft:
    description: Allows crafting the Hardcore Compass when the global toggle is enabled
    default: op
